name: ai_video_studio_pro
description: "A personal-use Android video and audio editing app powered by Flutter and FFmpeg."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  media_store_plus: ^0.1.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  ffmpeg_kit_flutter_new: ^4.6.7
  video_player: ^2.8.6
  google_mlkit_selfie_segmentation: ^0.12.1
  google_generative_ai: ^0.4.6
  flutter_background_service: ^5.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true